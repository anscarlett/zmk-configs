<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .key {
        fill: #f8f9fa;
        stroke: #343a40;
        stroke-width: 1.5;
        rx: 4;
        ry: 4;
      }
      .key:hover {
        fill: #e9ecef;
      }
      .key-text {
        font-family: Arial, sans-serif;
        font-size: 16px;
        font-weight: bold;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #212529;
        pointer-events: none;
      }
      .modifier-text {
        font-family: Arial, sans-serif;
        font-size: 10px;
        font-weight: normal;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #007bff;
        pointer-events: none;
      }
      .thumb-key {
        fill: #dee2e6;
        stroke: #343a40;
        stroke-width: 1.5;
        rx: 6;
        ry: 6;
      }
      .thumb-key:hover {
        fill: #ced4da;
      }
      .layout-title {
        font-family: Arial, sans-serif;
        font-size: 18px;
        font-weight: bold;
        text-anchor: middle;
        fill: #343a40;
      }
      .hand-label {
        font-family: Arial, sans-serif;
        font-size: 12px;
        text-anchor: middle;
        fill: #6c757d;
      }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="500" y="25" class="layout-title">Totem Split Keyboard Layout</text>
  
  <!-- Left Hand -->
  <text x="300" y="50" class="hand-label">Left Hand</text>
  
  <!-- Layer Lock key on outside -->
  <rect x="50" y="190" width="60" height="60" class="key"/>
  <text x="80" y="220" class="modifier-text">LAYER LOCK</text>
  
  <!-- Top Row -->
  <rect x="120" y="80" width="60" height="60" class="key"/>
  <text x="150" y="110" class="key-text">Q</text>
  <text x="150" y="130" class="modifier-text">LAYER 0</text>
  
  <rect x="190" y="70" width="60" height="60" class="key"/>
  <text x="220" y="100" class="key-text">W</text>
  <text x="220" y="120" class="modifier-text">LAYER 1</text>
  
  <rect x="260" y="60" width="60" height="60" class="key"/>
  <text x="290" y="90" class="key-text">E</text>
  <text x="290" y="110" class="modifier-text">LAYER 2</text>
  
  <rect x="330" y="70" width="60" height="60" class="key"/>
  <text x="360" y="100" class="key-text">R</text>
  <text x="360" y="120" class="modifier-text">LAYER 3</text>
  
  <rect x="400" y="80" width="60" height="60" class="key"/>
  <text x="430" y="110" class="key-text">T</text>
  <text x="430" y="130" class="modifier-text">LAYER 4</text>
  
  <!-- Home Row -->
  <rect x="120" y="150" width="60" height="60" class="key"/>
  <text x="150" y="180" class="key-text">A</text>
  <text x="150" y="200" class="modifier-text">LAYER 5</text>
  
  <rect x="190" y="140" width="60" height="60" class="key"/>
  <text x="220" y="170" class="key-text">S</text>
  <text x="220" y="190" class="modifier-text">LAYER 6</text>
  
  <rect x="260" y="130" width="60" height="60" class="key"/>
  <text x="290" y="160" class="key-text">D</text>
  <text x="290" y="180" class="modifier-text">LAYER 7</text>
  
  <rect x="330" y="140" width="60" height="60" class="key"/>
  <text x="360" y="170" class="key-text">F</text>
  <text x="360" y="190" class="modifier-text">LAYER 8</text>
  
  <rect x="400" y="150" width="60" height="60" class="key"/>
  <text x="430" y="180" class="key-text">G</text>
  <text x="430" y="200" class="modifier-text">LAYER 9</text>
  
  <!-- Bottom Row -->
  <rect x="120" y="220" width="60" height="60" class="key"/>
  <text x="150" y="250" class="key-text">Z</text>
  <text x="150" y="270" class="modifier-text">SHIFT</text>
  
  <rect x="190" y="210" width="60" height="60" class="key"/>
  <text x="220" y="240" class="key-text">X</text>
  <text x="220" y="260" class="modifier-text">CTRL</text>
  
  <rect x="260" y="200" width="60" height="60" class="key"/>
  <text x="290" y="230" class="key-text">C</text>
  <text x="290" y="250" class="modifier-text">SUPER</text>
  
  <rect x="330" y="210" width="60" height="60" class="key"/>
  <text x="360" y="240" class="key-text">V</text>
  <text x="360" y="260" class="modifier-text">ALT</text>
  
  <rect x="400" y="220" width="60" height="60" class="key"/>
  <text x="430" y="250" class="key-text">B</text>
  
  <!-- Left Thumb Cluster -->
  <rect x="190" y="300" width="60" height="60" class="thumb-key"/>
  <text x="220" y="330" class="key-text">⎋</text>
  
  <rect x="260" y="300" width="60" height="60" class="thumb-key"/>
  <text x="290" y="330" class="key-text">⇥</text>
  
  <rect x="330" y="300" width="60" height="60" class="thumb-key"/>
  <text x="360" y="330" class="key-text">␣</text>
  
  <!-- Right Hand -->
  <text x="700" y="50" class="hand-label">Right Hand</text>
  
  <!-- Top Row -->
  <rect x="540" y="80" width="60" height="60" class="key"/>
  <text x="570" y="110" class="key-text">Y</text>
  
  <rect x="610" y="70" width="60" height="60" class="key"/>
  <text x="640" y="100" class="key-text">U</text>
  
  <rect x="680" y="60" width="60" height="60" class="key"/>
  <text x="710" y="90" class="key-text">I</text>
  
  <rect x="750" y="70" width="60" height="60" class="key"/>
  <text x="780" y="100" class="key-text">O</text>
  
  <rect x="820" y="80" width="60" height="60" class="key"/>
  <text x="850" y="110" class="key-text">P</text>
  
  <!-- Home Row -->
  <rect x="540" y="150" width="60" height="60" class="key"/>
  <text x="570" y="180" class="key-text">H</text>
  
  <rect x="610" y="140" width="60" height="60" class="key"/>
  <text x="640" y="170" class="key-text">J</text>
  
  <rect x="680" y="130" width="60" height="60" class="key"/>
  <text x="710" y="160" class="key-text">K</text>
  
  <rect x="750" y="140" width="60" height="60" class="key"/>
  <text x="780" y="170" class="key-text">L</text>
  
  <rect x="820" y="150" width="60" height="60" class="key"/>
  <text x="850" y="165" class="key-text">:</text>
  <text x="850" y="185" class="key-text">;</text>
  
  <!-- Layer Lock key on outside -->
  <rect x="890" y="190" width="60" height="60" class="key"/>
  <text x="920" y="220" class="modifier-text">LAYER LOCK</text>
  
  <!-- Bottom Row -->
  <rect x="540" y="220" width="60" height="60" class="key"/>
  <text x="570" y="250" class="key-text">N</text>
  
  <rect x="610" y="210" width="60" height="60" class="key"/>
  <text x="640" y="240" class="key-text">M</text>
  <text x="640" y="260" class="modifier-text">ALT</text>
  
  <rect x="680" y="200" width="60" height="60" class="key"/>
  <text x="710" y="215" class="key-text">&lt;</text>
  <text x="710" y="235" class="key-text">,</text>
  <text x="710" y="255" class="modifier-text">SUPER</text>
  
  <rect x="750" y="210" width="60" height="60" class="key"/>
  <text x="780" y="225" class="key-text">&gt;</text>
  <text x="780" y="245" class="key-text">.</text>
  <text x="780" y="265" class="modifier-text">CTRL</text>
  
  <rect x="820" y="220" width="60" height="60" class="key"/>
  <text x="850" y="235" class="key-text">?</text>
  <text x="850" y="255" class="key-text">/</text>
  <text x="850" y="275" class="modifier-text">SHIFT</text>
  
  <!-- Right Thumb Cluster -->
  <rect x="610" y="300" width="60" height="60" class="thumb-key"/>
  <text x="640" y="330" class="key-text">⏎</text>
  
  <rect x="680" y="300" width="60" height="60" class="thumb-key"/>
  <text x="710" y="330" class="key-text">⌫</text>
  
  <rect x="750" y="300" width="60" height="60" class="thumb-key"/>
  <text x="780" y="330" class="key-text">⌦</text>
  
  <!-- Connection line to show split -->
  <line x1="480" y1="170" x2="520" y2="170" stroke="#adb5bd" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  
  <!-- Layout info -->
  <text x="500" y="420" class="hand-label">38-key split keyboard • Columnar stagger • Ergonomic thumb clusters</text>
  <text x="500" y="440" class="hand-label">Multi-layer design with hold modifiers for advanced functionality</text>
</svg>